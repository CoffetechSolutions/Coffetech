<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CoffeTech · Smart coffee solutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#2a1408; --panel:#381b0c; --gold:#d9a441; --cream:#e7dacc; --ink:#24120a; --text:#d9cfbd; --muted:#a89a85; --line:rgba(217,164,65,.35); --goldink:#7d5510;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:300 1rem/1.75 Montserrat,system-ui,sans-serif}
h1,h2,h3{font-family:Montserrat,system-ui,sans-serif;font-weight:800;margin:0;line-height:1.1;color:#f4ecdd}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:1060px;margin:0 auto;padding:0 24px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:rgba(42,20,8,.96);border-bottom:1px solid var(--line);z-index:5}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;font:800 1.15rem Montserrat,sans-serif;letter-spacing:.14em;color:#f4ecdd}
.logo img{height:38px;width:auto;display:block}
.right{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
nav a{margin-right:22px;text-decoration:none;font-weight:500;font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--text)}
nav a:last-child{margin-right:0}
nav a:hover{color:var(--gold)}
.lang button{background:none;border:0;border-bottom:1px solid transparent;color:var(--muted);font:500 .74rem Montserrat,sans-serif;letter-spacing:.14em;padding:4px 6px;cursor:pointer}
.lang button[aria-pressed="true"]{color:var(--gold);border-bottom-color:var(--gold)}
.lang button:hover{color:var(--gold)}
.hero .wrap{display:flex;flex-direction:column;align-items:center;text-align:center;gap:40px;padding-top:64px;padding-bottom:72px}
.hero h1{font-size:clamp(2.4rem,7vw,4.4rem);font-weight:800}
.hero p{font-size:1.05rem;max-width:46ch;margin:22px auto 32px;color:var(--text)}
.hero .pic{width:min(100%,560px);background:var(--cream);padding:28px;display:grid;place-items:center;outline:1px solid var(--gold);outline-offset:-10px}
.hero .pic img{max-height:400px;width:auto;max-width:100%;mix-blend-mode:multiply}
.btn{display:inline-block;background:var(--gold);color:var(--ink);padding:13px 30px;border:1px solid var(--gold);font-weight:500;font-size:.76rem;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;margin:0 6px 10px}
.btn.alt{background:transparent;color:#f4ecdd}
.btn:hover{background:#e6b95c;color:var(--ink)}
section{padding:80px 0}
section h2{font-size:clamp(1.8rem,4.5vw,2.6rem);font-weight:800;margin-bottom:10px;text-align:center}
.sub{margin:0 auto 36px;color:var(--muted);max-width:60ch;text-align:center}
.light{background:var(--cream);color:#43301f}
.light h2,.light h3{color:var(--ink)}
.light .sub{color:#6b5640}
.group{display:flex;align-items:center;gap:18px;font-size:1.1rem;font-weight:700;letter-spacing:.05em;margin:44px 0 28px}
.group::before,.group::after{content:"";flex:1;height:1px;background:rgba(36,18,10,.25)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px 40px;max-width:780px;margin:0 auto}
.card{display:block;text-align:center;text-decoration:none;color:#43301f}
.card .thumb{height:340px;overflow:hidden;display:flex;align-items:center;justify-content:center;border-bottom:1px solid rgba(36,18,10,.25);padding:10px 10px 18px}
.card .thumb img{display:block;width:100%;height:310px;object-fit:contain;mix-blend-mode:multiply;transition:transform .25s}
.card:hover .thumb img{transform:scale(1.03)}
.card h3{position:relative;font-size:1.15rem;font-weight:700;margin:18px 0 4px;color:var(--ink)}
.card small{display:block;font-size:.88rem;color:#6b5640;margin-bottom:8px}
.price{font-weight:500;letter-spacing:.04em;color:var(--goldink)}
.srv{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.srv a{display:block;text-align:center;padding:28px 4px;border-bottom:1px solid var(--line);text-decoration:none}
.srv a:hover h3{color:var(--gold)}
.srv h3{font-size:1.2rem;font-weight:700;transition:color .2s}
.srv p{margin:8px auto 0;color:var(--muted);max-width:56ch;font-size:.95rem}
.srv .price{color:var(--gold);display:block;margin-top:4px}
.contact{background:var(--panel);border:1px solid var(--line);padding:36px;text-align:center;max-width:860px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:26px 34px}
.contact dt{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.contact dd{margin:0;color:#f4ecdd}
.contact .btn{grid-column:1/-1;justify-self:center;margin:0}
footer{padding:30px 0;text-align:center;font-size:.8rem;letter-spacing:.06em;color:var(--muted);border-top:1px solid var(--line)}
.back{display:inline-block;margin:36px 0 22px;font-size:.76rem;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;color:var(--gold)}
.detail{display:flex;flex-direction:column;align-items:center;text-align:center;gap:36px;max-width:680px;margin:0 auto;padding-bottom:70px}
.detail .big{width:100%;background:var(--cream);min-height:440px;display:grid;place-items:center;padding:30px;outline:1px solid var(--gold);outline-offset:-10px}
.detail .big img{max-height:440px;width:auto;max-width:100%;mix-blend-mode:multiply}
.detail .big.dk{background:var(--panel)}
.detail .big.dk img{mix-blend-mode:normal;max-height:200px}
.detail h1{font-size:clamp(2rem,5vw,3rem);font-weight:800;margin-bottom:8px}
.detail .ref{color:var(--muted);margin:0 0 6px;font-size:.9rem}
.detail .p{font:800 2rem Montserrat,sans-serif;color:var(--gold);margin:6px 0 18px}
.detail ul{list-style:none;padding:0;margin:18px 0 30px;color:var(--text)}
.detail li{margin-bottom:4px}
@media (max-width:780px){.hero .wrap{padding-top:44px;padding-bottom:44px}.detail .big{min-height:300px}section{padding:56px 0}.right{gap:14px}nav a{margin-right:14px}}@media (max-width:560px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<script>
/* ============================================================
   EDITA AQUÍ: textos, preus i contacte. Cada text té 3 idiomes:
   ca (català), es (castellà), en (anglès).
   Per afegir un producte, copia un bloc i canvia l'id

var L = "ca";
try { var g = localStorage.getItem("ct-lang"); if (g) L = g; else { var n = (navigator.language||"ca").slice(0,2); L = (n==="es"||n==="en") ? n : "ca"; } } catch(e){}
var app = document.getElementById("app");
function T(k){ return UI[L][k]; }
function pick(o){ return o[L]; }
function eur(n){ return new Intl.NumberFormat(L,{style:"currency",currency:"EUR"}).format(n); }
function preuS(s){ if(s.preuTxt) return pick(s.preuTxt); var p = eur(s.preu); if(s.des) p = T("des")+" "+p+(s.per?" "+pick(s.per):""); return p; }

function tProd(p){ return '<a class="card" href="#'+p.id+'"><div class="thumb"><img src="'+IMG[p.img]+'" alt="'+p.nom+'"></div><h3>'+p.nom+'</h3><small>'+pick(p.curt)+'</small><span class="price">'+eur(p.preu)+'</span></a>'; }
function tServ(s){ return '<li><a href="#'+s.id+'"><h3>'+pick(s.nom)+'</h3><span class="price">'+preuS(s)+'</span><p>'+pick(s.desc)+'</p></a></li>'; }
function grups(){
  return ["maq","caf"].map(function(k){
    var l = PRODUCTES.filter(function(p){return p.grup===k;});
    return l.length ? '<h3 class="group">'+pick(GRUPS[k])+'</h3><div class="grid">'+l.map(tProd).join("")+'</div>' : "";
  }).join("");
}
function portada(){
  return '<div class="hero"><div class="wrap"><div><h1>'+T("inici")+'</h1><p>'+T("intro")+'</p><a class="btn" href="#productes">'+T("veure")+'</a><a class="btn alt" href="#contacte">'+T("cont")+'</a></div><div class="pic"><img src="'+IMG.velora+'" alt="CoffeTech Velora"></div></div></div>'+
  '<section id="productes" class="light"><div class="wrap"><h2>'+T("prod")+'</h2><p class="sub">'+T("subP")+'</p>'+grups()+'</div></section>'+
  '<section id="serveis"><div class="wrap"><h2>'+T("serv")+'</h2><p class="sub">'+T("subS")+'</p><ul class="srv">'+SERVEIS.map(tServ).join("")+'</ul></div></section>'+
  '<section id="contacte" style="padding-top:20px"><div class="wrap"><h2>'+T("cont")+'</h2><p class="sub">'+T("subC")+'</p><dl class="contact"><div><dt>'+T("correu")+'</dt><dd>'+CONTACTE.email+'</dd></div><div><dt>'+T("tel")+'</dt><dd>'+CONTACTE.telefon+'</dd></div><div><dt>'+T("adr")+'</dt><dd>'+T("adreca")+'</dd></div><div><dt>Web</dt><dd>'+CONTACTE.web+'</dd></div><a class="btn" href="mailto:'+CONTACTE.email+'">'+T("enviar")+'</a></dl></div></section>';
}
function detall(nom, preu, desc, det, refTxt, vis, tornar, etiqueta){
  var subj = encodeURIComponent(T("info")+": "+nom);
  return '<div class="wrap"><a class="back" href="#'+tornar+'">← '+T("tornar")+' '+etiqueta.toLowerCase()+'</a><div class="detail">'+vis+'<div><h1>'+nom+'</h1>'+(refTxt?'<p class="ref">'+refTxt+'</p>':'')+'<div class="p">'+preu+'</div><p>'+desc+'</p><ul>'+det.map(function(d){return "<li>"+d+"</li>";}).join("")+'</ul><a class="btn" href="#contacte">'+T("info")+'</a></div></div></div>';
}
function troba(l,id){ return l.filter(function(x){return x.id===id;})[0]; }
function cap(){
  document.documentElement.lang = L;
  document.getElementById("nav").innerHTML = '<a href="#productes">'+T("prod")+'</a><a href="#serveis">'+T("serv")+'</a><a href="#contacte">'+T("cont")+'</a>';
  document.getElementById("lang").innerHTML = ["ca","es","en"].map(function(c){ return '<button data-l="'+c+'" aria-pressed="'+(c===L)+'">'+c.toUpperCase()+'</button>'; }).join("");
  document.getElementById("foot").innerHTML = '<div class="wrap">'+T("foot")+'</div>';
}
function pinta(){
  cap();
  var h = location.hash.replace("#",""), p = troba(PRODUCTES,h), s = troba(SERVEIS,h);
  if(p){ app.innerHTML = detall(p.nom, eur(p.preu), pick(p.desc), pick(p.det), pick(p.curt)+" · "+T("ref")+" "+p.ref, '<div class="big"><img src="'+IMG[p.img]+'" alt="'+p.nom+'"></div>', "productes", T("prod")); return; }
  if(s){ app.innerHTML = detall(pick(s.nom), preuS(s), pick(s.desc), pick(s.det), "", '<div class="big dk"><img src="'+IMG.logo+'" alt="CoffeTech"></div>', "serveis", T("serv")); return; }
  app.innerHTML = portada();
}
document.getElementById("lang").addEventListener("click", function(e){
  var c = e.target.getAttribute && e.target.getAttribute("data-l");
  if(!c) return;
  L = c; try { localStorage.setItem("ct-lang", c); } catch(x){}
  var y = window.scrollY; pinta(); window.scrollTo(0,y);
});
window.addEventListener("hashchange", function(){
  pinta();
  var el = document.getElementById(location.hash.replace("#",""));
  if(el) el.scrollIntoView(); else window.scrollTo(0,0);
});
pinta();
